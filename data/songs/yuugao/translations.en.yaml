- point to the hour when that person comes home
- my stomach must be growling by now
- What should I cook today?
- Was it my imagination? Someone's voice—
- a message on the answering machine
- "In a moment that person will say in a fluster:"
- "'I don't need dinner'"
- How far does the wind
- blow on, I wonder
- Someday, even days like these
- will become something to miss
- Alone with this hollow gap of time
